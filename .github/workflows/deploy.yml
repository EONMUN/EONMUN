name: Deploy Astro

on:
  push:
    branches: [master]
    paths:
      - 'code/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/cloudflare-deploy/**'
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Master push promotes astro to production on the `eonmun` worker
      # (replacing whatever version is currently active — initially the
      # Next.js + OpenNext build). The worker name is set in
      # code/wrangler.jsonc, so the same target works for previews and
      # production.
      #
      # After the first `wrangler deploy` lands, the worker is "claimed"
      # for wrangler's deployment model and subsequent
      # `wrangler versions upload --preview-alias` calls (used by
      # preview.yml) start emitting branch-aliased preview URLs.
      #
      # Rollback to the prior Next.js version is one command:
      #   bunx wrangler versions deploy --name eonmun <old-version-id>
      - name: Deploy Astro to eonmun (production)
        uses: ./.github/actions/cloudflare-deploy
        with:
          mode: deploy
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
