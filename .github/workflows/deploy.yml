name: Deploy Astro

on:
  push:
    branches: [master]
    paths:
      - 'code/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/cloudflare-deploy/**'
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On master we still only do a versioned upload (no production
      # promote). The legacy Next.js worker remains the promoted
      # version on eonmun.com — we don't want every astro merge to
      # silently take over the production domain. To cut over, run
      # `bunx wrangler versions deploy` against the latest astro
      # version manually once we're ready.
      - name: Upload Astro version
        uses: ./.github/actions/cloudflare-deploy
        with:
          mode: upload
          preview-alias: main
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
