name: Deploy Astro

on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/cloudflare-deploy/**'
  workflow_dispatch:
    inputs:
      catalog_operation:
        description: Temporary dimension release operation
        type: choice
        default: deploy
        options: [deploy, inspect, migrate, cleanup]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.catalog_operation == 'deploy'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Main pushes deploy the Astro worker defined in code/wrangler.jsonc.
      - name: Deploy Astro worker
        uses: ./.github/actions/cloudflare-deploy
        with:
          mode: deploy
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  catalog-release:
    if: github.event_name == 'workflow_dispatch' && inputs.catalog_operation != 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: code
      - name: Inspect catalog
        if: inputs.catalog_operation == 'inspect'
        working-directory: code
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun run scripts/release-dimensions.ts inspect
      - name: Back up and migrate catalog
        if: inputs.catalog_operation == 'migrate'
        working-directory: code
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          bun run scripts/release-dimensions.ts backup
          bun run db:migrate
          bun run scripts/release-dimensions.ts inspect
      - name: Remove accepted release backup
        if: inputs.catalog_operation == 'cleanup'
        working-directory: code
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun run scripts/release-dimensions.ts cleanup
