name: Deploy Astro

on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/cloudflare-deploy/**'
  workflow_dispatch:
    inputs:
      configure_stripe:
        description: 'Provision Stripe checkout/webhook using the GitHub live secret key'
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Main pushes deploy the Astro worker defined in code/wrangler.jsonc.
      - name: Deploy Astro worker
        uses: ./.github/actions/cloudflare-deploy
        with:
          mode: deploy
          turso-database-url: ${{ secrets.TURSO_DATABASE_URL }}
          turso-auth-token: ${{ secrets.TURSO_AUTH_TOKEN }}
          configure-stripe: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_stripe }}
          stripe-secret-key: ${{ secrets.STRIPE_SECRET_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
