# Web Tests and Preview Deployment
#
# Automated testing and preview environment deployment for pull requests.
#
# IMPORTANT: Changes to this workflow should be reflected in:
# - docs/conventions/cloudflare-workers-turso.md (Preview Deployment section)
# - bin/README.md (if affecting secrets workflow)
#
# Triggers:
# - Pull request opened/updated → Runs tests and deploys preview
# - Pull request closed → Cleans up preview environment
#
# Jobs:
# 1. lint-and-typecheck: Runs ESLint and TypeScript checks
# 2. deploy-preview: Deploys to preview environment (only if tests pass)
#    - Deploys to https://pr-{number}.eonmun.com
#    - Uploads runtime secrets from 'preview' environment
#    - Comments on PR with preview URL
# 3. cleanup-preview: Removes preview environment when PR closes
#
# Required GitHub Environment:
# - 'preview' (with TURSO_AUTH_TOKEN, TURSO_DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
#
# Setup:
# 1. Create .env file: .env.preview
# 2. Run: bin/gh-secrets --preview-only
# 3. Create a pull request

name: Web Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - '.github/workflows/web.test.yml'
      - '.github/actions/deploy-cloudflare-worker/**'

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Test summary
        if: success()
        run: |
          echo "## ✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "All linting and type checks passed successfully" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event.action != 'closed'
    environment: production
    concurrency: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Upload runtime secrets (Preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_AUTH_TOKEN_READ: ${{ secrets.TURSO_AUTH_TOKEN_READ }}
          TURSO_AUTH_TOKEN_WRITE: ${{ secrets.TURSO_AUTH_TOKEN_WRITE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          echo "$TURSO_AUTH_TOKEN_READ" | npx wrangler secret put TURSO_AUTH_TOKEN_READ --env preview
          echo "$TURSO_AUTH_TOKEN_WRITE" | npx wrangler secret put TURSO_AUTH_TOKEN_WRITE --env preview
          echo "$TURSO_DATABASE_URL" | npx wrangler secret put TURSO_DATABASE_URL --env preview

      - name: Build Next.js app for Cloudflare
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN_READ }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers (Preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --env preview

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Complete\n\nYour preview environment is ready!\n\n- **Environment**: Preview PR-${{ github.event.pull_request.number }}\n- **URL**: https://pr-${{ github.event.pull_request.number }}.eonmun.com\n\n✅ All tests passed\n\n_This preview will be automatically deleted when the PR is closed._`
            })

      - name: Deployment summary
        run: |
          echo "## 🚀 Preview Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Successfully deployed preview environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Preview PR-${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://pr-${{ github.event.pull_request.number }}.eonmun.com" >> $GITHUB_STEP_SUMMARY

  cleanup-preview:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Delete preview deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Cleaning up preview environment for PR-${{ github.event.pull_request.number }}"
          # Note: Add cleanup command if opennextjs-cloudflare supports it
          # Otherwise, preview environments can be manually cleaned up from Cloudflare dashboard

