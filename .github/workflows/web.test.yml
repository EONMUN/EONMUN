# Web Tests and Preview Deployment
#
# Automated testing and preview environment deployment for pull requests.
#
# IMPORTANT: Changes to this workflow should be reflected in:
# - docs/conventions/cloudflare-workers-turso.md (Preview Deployment section)
# - bin/README.md (if affecting secrets workflow)
#
# Triggers:
# - Pull request opened/updated → Runs tests and deploys preview
# - Pull request closed → Cleans up preview environment
#
# Jobs:
# 1. lint-and-typecheck: Runs ESLint and TypeScript checks
# 2. deploy-preview: Deploys to preview environment (only if tests pass)
#    - Deploys to https://pr-{number}.eonmun.com
#    - Uploads runtime secrets from 'preview' environment
#    - Comments on PR with preview URL
# 3. cleanup-preview: Removes preview environment when PR closes
#
# Required GitHub Environment:
# - 'preview' (with TURSO_AUTH_TOKEN, TURSO_DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
#
# Setup:
# 1. Create .env file: .env.preview
# 2. Run: bin/gh-secrets --preview-only
# 3. Create a pull request

name: Web Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'package.json'
      - 'next.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/web.test.yml'
      - '.github/actions/deploy-cloudflare-worker/**'

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Test summary
        if: success()
        run: |
          echo "## ✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "All linting and type checks passed successfully" >> $GITHUB_STEP_SUMMARY

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    # TODO: Add E2E coverage collection
    # Requires instrumenting the Next.js app with babel-plugin-istanbul or @istanbuljs/nyc-config-typescript
    # and using Playwright's page.coverage API or a Playwright coverage plugin
    # This would need to be merged with the Vitest coverage from the coverage job above

    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080
          - 5001:5001
        options: --platform linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace('^', '')")" >> $GITHUB_OUTPUT

      - name: Cache playwright binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run Migration
        env:
          AUTH_SECRET: test-secret-for-ci
          DATABASE_URL: http://localhost:8080
        run: npm run db:push

      - name: Load fixture data
        env:
          AUTH_SECRET: test-secret-for-ci
          DATABASE_URL: http://localhost:8080
        run: npm run db:fixtures:load

      - name: Setup environment
        run: cp .env.example .env

      - name: Run Playwright tests
        env:
          AUTH_SECRET: test-secret-for-ci
          DATABASE_URL: http://localhost:8080
          NEXT_PUBLIC_R2_DOMAIN: r2.meze.fyi
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: npm run test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
