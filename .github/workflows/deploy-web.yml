# Deploy Web to Cloudflare
#
# Automated deployment workflow for production and next environments.
#
# IMPORTANT: Changes to this workflow should be reflected in:
# - docs/conventions/cloudflare-workers-turso.md (Production Deployment section)
# - bin/README.md (if affecting secrets workflow)
#
# Triggers:
# - Push to 'master' branch → Deploys to production (https://eonmun.com)
# - Push to 'next' branch → Deploys to next (https://next.eonmun.com)
#
# Workflow:
# 1. Builds and deploys via custom action (.github/actions/deploy-cloudflare-worker)
# 2. Uploads runtime secrets to Cloudflare Workers (TURSO_AUTH_TOKEN, TURSO_DATABASE_URL)
# 3. Secrets are read from GitHub environment-specific secret stores
#
# Required GitHub Environments:
# - 'production' (with TURSO_AUTH_TOKEN, TURSO_DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# - 'next' (with same secrets, shares preview database)
#
# Setup:
# 1. Create .env files: .env.production, .env.preview
# 2. Run: bin/gh-secrets
# 3. Push to master or next branch

name: Deploy Web to Cloudflare

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - '.github/workflows/deploy-web.yml'
      - '.github/actions/deploy-cloudflare-worker/**'

env:
  NODE_VERSION: '22'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

