# Deploy Web to Cloudflare
#
# Automated deployment workflow for production and next environments.
#
# IMPORTANT: Changes to this workflow should be reflected in:
# - docs/conventions/cloudflare-workers-turso.md (Production Deployment section)
# - bin/README.md (if affecting secrets workflow)
#
# Triggers:
# - Push to 'master' branch → Deploys to production (https://eonmun.com)
# - Push to 'next' branch → Deploys to next (https://next.eonmun.com)
#
# Workflow:
# 1. Builds and deploys via custom action (.github/actions/deploy-cloudflare-worker)
# 2. Uploads runtime secrets to Cloudflare Workers (TURSO_AUTH_TOKEN, TURSO_DATABASE_URL)
# 3. Secrets are read from GitHub environment-specific secret stores
#
# Required GitHub Environments:
# - 'production' (with TURSO_AUTH_TOKEN, TURSO_DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# - 'next' (with same secrets, shares preview database)
#
# Setup:
# 1. Create .env files: .env.production, .env.preview
# 2. Run: bin/gh-secrets
# 3. Push to master or next branch

name: Deploy Web to Cloudflare

on:
  push:
    branches: [ master, next ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - '.github/workflows/deploy-web.yml'
      - '.github/actions/deploy-cloudflare-worker/**'

env:
  NODE_VERSION: '22'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    concurrency: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Upload runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_AUTH_TOKEN_READ: ${{ secrets.TURSO_AUTH_TOKEN_READ }}
          TURSO_AUTH_TOKEN_WRITE: ${{ secrets.TURSO_AUTH_TOKEN_WRITE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          echo "$TURSO_AUTH_TOKEN_READ" | npx wrangler secret put TURSO_AUTH_TOKEN_READ --env production
          echo "$TURSO_AUTH_TOKEN_WRITE" | npx wrangler secret put TURSO_AUTH_TOKEN_WRITE --env production
          echo "$TURSO_DATABASE_URL" | npx wrangler secret put TURSO_DATABASE_URL --env production

      - name: Build Next.js app for Cloudflare
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN_READ }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Successfully deployed web app to Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://eonmun.com" >> $GITHUB_STEP_SUMMARY

  deploy-next:
    name: Deploy to Next
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/next'
    environment: preview
    concurrency: next
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Upload runtime secrets (Next)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_AUTH_TOKEN_READ: ${{ secrets.TURSO_AUTH_TOKEN_READ }}
          TURSO_AUTH_TOKEN_WRITE: ${{ secrets.TURSO_AUTH_TOKEN_WRITE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          echo "$TURSO_AUTH_TOKEN_READ" | npx wrangler secret put TURSO_AUTH_TOKEN_READ --env next
          echo "$TURSO_AUTH_TOKEN_WRITE" | npx wrangler secret put TURSO_AUTH_TOKEN_WRITE --env next
          echo "$TURSO_DATABASE_URL" | npx wrangler secret put TURSO_DATABASE_URL --env next

      - name: Build Next.js app for Cloudflare
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN_READ }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers (Next)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --env next

      - name: Deployment summary
        run: |
          echo "## 🚀 Next Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Successfully deployed web app to Cloudflare Workers (Next)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Next" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://next.eonmun.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: Using preview database" >> $GITHUB_STEP_SUMMARY



