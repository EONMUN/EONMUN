services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strapi

  strapi-init:
    build:
      context: ./strapi
      dockerfile: Dockerfile
      target: base
    volumes:
      - ./strapi:/app
    command: npm install

  strapi-seed:
    build:
      context: ./strapi
      dockerfile: Dockerfile
      target: base
    volumes:
      - ./strapi:/app
    env_file:
      - strapi/.env
    command: npm run seed:example
    depends_on:
      strapi-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - strapi

  strapi:
    extends:
      service: strapi-seed
    environment:
      - HOST=0.0.0.0
      - PORT=${STRAPI_INTERNAL_PORT:-1337}
    command: npm run dev
    ports:
      - "${STRAPI_PORT:-1337}:${STRAPI_INTERNAL_PORT:-1337}"

  web-init:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: base
    volumes:
      - ./web:/app
    command: npm install

  web:
    extends:
      service: web-init
    environment:
      - PORT=${WEB_INTERNAL_PORT:-3000}
    env_file:
      - strapi/.env
      - web/.env
    command: npm run dev
    ports:
      - "${WEB_PORT:-3002}:${WEB_INTERNAL_PORT:-3000}"
    depends_on:
      web-init:
        condition: service_completed_successfully
      strapi:
        condition: service_started
    networks:
      - strapi

volumes:
  db_data:
networks:
  strapi:
    driver: bridge
